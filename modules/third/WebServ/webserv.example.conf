/*
 * Example configuration file for WebServ.
 *
 * WebServ is a pseudoclient that lets IRC staff manage service requests
 * (TheLounge / ZNC accounts) and network-link requests submitted through
 * the IRC4Fun web portal, directly from IRC.
 *
 * Commands:  LIST, VIEW, APPROVE, DENY, STATS
 */

/*
 * First, create the service (pseudo-client).
 */
service
{
  /*
   * The name of the WebServ client.
   * If you change this value, update the client directive below too.
   */
  nick = "WebServ"

  /*
   * The username of the WebServ client.
   */
  user = "WebServ"

  /*
   * The hostname of the WebServ client.
   */
  host = "services.host"

  /*
   * The realname of the WebServ client.
   */
  gecos = "Web Service Request Manager"

  /*
   * The modes this client should use.
   * Do not modify this unless you know what you are doing.
   */
  #modes = "+o"

  /*
   * Optional channels to join.
   */
  channels = "@#services"
}

/*
 * Core WebServ module configuration.
 */
module
{
  name = "webserv"

  /*
   * The name of the client that should be WebServ.
   * Must match the nick defined in the service{} block above.
   */
  client = "WebServ"

  /*
   * The base URL of the Django WebServ API.
   * Must include a trailing slash.
   */
  api_url = "https://webdev.irc4fun.net/dev/api/webserv/"

  /*
   * Bearer token for authenticating with the Django API.
   * Must match the WEBSERV_API_TOKEN setting in the Django .env.
   */
  api_token = "CHANGE_ME"

  /*
   * Where to send staff notifications (APPROVE/DENY actions).
   * - "#channel" to send to a staff channel (WebServ will join it)
   * - "globops" to send to oper globops/wallops
   * - empty to disable notifications
   */
  staff_target = "#services"

  /*
   * Oper privilege required to use WebServ commands.
   * Opers without this privilege will see "Access denied."
   */
  staff_priv = "webserv/staff"

  /*
   * How WebServ replies to users:
   * - "notice"  (default)
   * - "privmsg"
   */
  reply_method = "privmsg"

  /*
   * How often (in seconds) WebServ polls the API for new pending requests.
   * When a new request is detected, WebServ announces it in staff_target.
   * Set to 0 to disable automatic polling.
   * Default: 60
   */
  poll_interval = 60
}

/*
 * Register WebServ commands.
 *
 * Staff commands are hidden from the public HELP listing.
 */

/* Give it a help command. */
command { service = "WebServ"; name = "HELP"; command = "generic/help"; }

/* Core staff commands (hidden from public). */
command { service = "WebServ"; name = "LIST";    command = "webserv/list";    hide = true; }
command { service = "WebServ"; name = "VIEW";    command = "webserv/view";    hide = true; }
command { service = "WebServ"; name = "APPROVE"; command = "webserv/approve"; hide = true; }
command { service = "WebServ"; name = "DENY";    command = "webserv/deny";    hide = true; }
command { service = "WebServ"; name = "STATS";   command = "webserv/stats";   hide = true; }
command { service = "WebServ"; name = "POLL";    command = "webserv/poll";    hide = true; }
